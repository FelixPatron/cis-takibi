<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151a">
<title>Çiş Takibi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#14151a; --surface:#22242c; --surface2:#2b2e38; --text:#eceef3; --muted:#8a8f9e;
    --red:#c8283a; --blue:#1d6fd1; --purple:#8a35b0; --empty:#292b35;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .view{display:none;min-height:100%;padding:14px;max-width:640px;margin:0 auto}
  .view.active{display:block}

  /* giriş */
  #giris{text-align:center;padding-top:14vh}
  #giris h1{font-size:28px;margin:0 0 6px}
  #giris p{color:var(--muted);margin:0 0 32px}
  .rol{display:block;width:100%;padding:26px 0;margin-bottom:14px;border-radius:14px;font-size:20px;font-weight:700}
  .rol.kirmizi{background:var(--red)} .rol.mavi{background:var(--blue)}

  /* ana ekran */
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  header h1{font-size:20px;margin:0}
  #durum{font-size:12px;color:var(--muted)}
  #durum.hata{color:#ff8a8a}
  #isaretle{width:100%;padding:20px 0;border-radius:14px;font-size:18px;font-weight:700;margin-bottom:14px;
    transition:transform .08s}
  #isaretle:active{transform:scale(.98)}
  #isaretle small{display:block;font-weight:500;opacity:.85;font-size:13px;margin-top:2px}
  #saatler{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .saat{position:relative;overflow:hidden;background:var(--surface);border-radius:12px;padding:14px 12px 16px;text-align:left}
  .saat b{font-size:17px;display:block;font-variant-numeric:tabular-nums}
  .saat span{font-size:13px;color:var(--muted)}
  .saat i{position:absolute;left:0;bottom:0;height:4px;background:var(--purple);width:0}
  .saat.simdi{outline:2px solid var(--muted)}
  .saat.dolu i{background:#3fbf7f}

  /* skor tablosu */
  #skor{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .sk{border-radius:12px;padding:12px 14px;background:var(--surface);position:relative}
  .sk small{display:block;font-size:12px;color:rgba(255,255,255,.8)}
  .sk b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
  .sk.k{background:var(--red)} .sk.m{background:var(--blue)}
  .sk.onde::after{content:"👑";position:absolute;right:12px;top:10px;font-size:18px}
  #skorAlt{grid-column:1 / -1;display:flex;justify-content:space-between;background:var(--surface);
    border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
  #skorAlt b{color:var(--text);font-variant-numeric:tabular-nums}

  /* skor kutuları tıklanabilir */
  button.sk{border:0;width:100%;text-align:left;color:#fff;font:inherit}
  button.sk:active{filter:brightness(.92)}
  .sk em{position:absolute;right:12px;bottom:10px;font-style:normal;font-size:12px;opacity:.85}

  /* istatistik ekranı */
  #istatistik h3{font-size:14px;color:var(--muted);font-weight:600;margin:22px 2px 10px}
  #istKartlar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ik{background:var(--surface);border-radius:12px;padding:10px 12px}
  .ik small{display:block;font-size:11px;color:var(--muted)}
  .ik b{display:block;font-size:18px;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
  #istGrafik{display:flex;align-items:flex-end;gap:3px;background:var(--surface);border-radius:12px;padding:14px 10px 8px}
  .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
  .col .v{font-size:10px;margin-bottom:2px;font-variant-numeric:tabular-nums;min-height:12px}
  .col .bar{width:100%;border-radius:4px 4px 0 0;background:var(--renk,#777)}
  .col.bos .bar{opacity:.25}
  .col .x{font-size:9px;color:var(--muted);margin-top:4px;height:11px}
  #istParca{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ip{background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center}
  .ip small{display:block;font-size:11px;color:var(--muted)}
  .ip b{display:block;font-size:20px;margin:3px 0}
  .ip span{font-size:11px;color:var(--muted)}
  .il{background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:8px}
  .il .satir{display:flex;justify-content:space-between;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .il .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .il .chip{background:var(--surface2);border-radius:8px;padding:3px 8px;font-size:12px;font-variant-numeric:tabular-nums}
  .ik span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
  .chip b{color:#ffd76a;margin-left:2px}
  .bosdurum{color:var(--muted);font-size:14px;text-align:center;padding:20px}

  /* detay */
  .ust{display:flex;align-items:center;gap:12px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
  .geri{background:var(--surface2);padding:10px 16px;border-radius:10px;font-weight:700}
  .ust h2{margin:0;font-size:18px}
  #dakikalar{display:grid;gap:5px}
  .dk{display:flex;justify-content:space-between;align-items:center;background:var(--empty);
    border-radius:8px;padding:0 12px;height:45px;font-variant-numeric:tabular-nums}
  .dk b{font-size:15px}
  .dk span{font-size:13px;color:var(--muted)}
  .dk.k{background:var(--red)} .dk.m{background:var(--blue)} .dk.km{background:var(--purple)}
  .dk.k span,.dk.m span,.dk.km span{color:rgba(255,255,255,.9)}
  .dk.simdi{outline:2px solid #fff}

  /* toast + tombala */
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#f2f3f7;color:#14151a;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;
    opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center;z-index:10}
  #toast.goster{opacity:1;transform:translate(-50%,0)}
  #tombala{position:fixed;inset:0;background:rgba(10,10,14,.92);display:none;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:30px;z-index:20}
  #tombala.goster{display:flex}
  #tombala h1{font-size:44px;margin:0 0 10px}
  #tombala p{color:var(--muted);margin:0 0 26px;font-size:17px}
  #tombala button{background:var(--purple);padding:14px 36px;border-radius:12px;font-weight:700;font-size:16px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="giris" class="view">
  <h1>Çiş Takibi</h1>
  <p>Kim olarak giriş yapıyorsunuz?</p>
  <button class="rol kirmizi" data-rol="kirmizi">Boran (Kırmızı)</button>
  <button class="rol mavi" data-rol="mavi">Burak (Mavi)</button>
</section>

<section id="ana" class="view">
  <header><h1>Çiş Takibi</h1><div id="durum">bağlanıyor…</div></header>
  <div id="skor">
    <button class="sk k" id="skK" data-kisi="kirmizi"><small>Boran</small><b>0</b><em>Detay ›</em></button>
    <button class="sk m" id="skM" data-kisi="mavi"><small>Burak</small><b>0</b><em>Detay ›</em></button>
    <div id="skorAlt"><span>Toplam: <b id="skT">0</b></span><span>İkisi birden: <b id="skO">0</b></span></div>
  </div>
  <button id="isaretle">Şu Anki Dakikayı İşaretle</button>
  <div id="saatler"></div>
</section>

<section id="detay" class="view">
  <div class="ust"><button class="geri" id="geri">← Geri</button><h2 id="detayBaslik"></h2></div>
  <div id="dakikalar"></div>
</section>

<section id="istatistik" class="view">
  <div class="ust"><button class="geri" id="geriIst">← Geri</button><h2 id="istBaslik"></h2></div>
  <div id="istKartlar"></div>
  <h3>Saatlere göre dağılım</h3>
  <div id="istGrafik"></div>
  <h3>Gün içi dağılım</h3>
  <div id="istParca"></div>
  <h3>Kayıtlar</h3>
  <div id="istListe"></div>
</section>

<div id="toast"></div>
<div id="tombala">
  <h1 id="tombalaBaslik">🎉 TOMBALA! 🎉</h1>
  <p id="tombalaMetin"></p>
  <button id="tombalaKapat">Harika</button>
</div>

<script>
const FIREBASE_URL = "https://ciss-efe78-default-rtdb.europe-west1.firebasedatabase.app/dakikalar";
const ADLAR = { kirmizi: "Boran", mavi: "Burak" };
// ntfy konuları: herkes sadece KENDİ konusuna abone olur, karşı tarafa bildirim gönderir.
// Bu adresleri kimseyle paylaşmayın (bilen herkes bildirim okuyabilir/gönderebilir).
const NTFY = "https://ntfy.sh";
const KONU = { kirmizi: "cis-boran-a5d1fd0f592f", mavi: "cis-burak-2597dc118a73" };
const DIGER = { kirmizi: "mavi", mavi: "kirmizi" };

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const keyOf = (h, m) => `${pad(h)}_${pad(m)}`;

let kullanici = null;
let veri = {};
let acikSaat = null;
let pollTimer = null;
let acikKisi = null;

function cerezOku(k){ const m = document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : null }
function cerezYaz(k,v){ document.cookie = `${k}=${encodeURIComponent(v)}; max-age=${60*60*24*3650}; path=/; SameSite=Lax` }
function depoOku(k){ let v = null; try{ v = localStorage.getItem(k) }catch(e){} return v || cerezOku(k) }
function depoYaz(k,v){ try{ localStorage.setItem(k,v) }catch(e){} cerezYaz(k,v) }
function depoSil(k){ try{ localStorage.removeItem(k) }catch(e){} document.cookie = k + "=; max-age=0; path=/" }

/* ---------- ağ ---------- */
async function istek(url, opts = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 7000);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function yenile() {
  try {
    veri = (await istek(`${FIREBASE_URL}.json`)) || {};
    $("#durum").textContent = "canlı • " + new Date().toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
    $("#durum").className = "";
    ciz();
  } catch (e) {
    $("#durum").textContent = "bağlantı yok";
    $("#durum").className = "hata";
  }
}

/* ---------- bildirim (ntfy) ---------- */
async function bildir(hedef, baslik, mesaj, etiketler) {
  try {
    await fetch(NTFY + "/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: KONU[hedef], title: baslik, message: mesaj, tags: etiketler || [], priority: 3 })
    });
    return true;
  } catch (e) { return false; }
}

/* ---------- çinko / tombala hesabı ---------- */
function durumHesapla(v) {
  let k = 0, m = 0;
  const doluSaat = Array(24).fill(0);
  for (let h = 0; h < 24; h++) {
    for (let dk = 0; dk < 60; dk++) {
      const o = v[keyOf(h, dk)] || {};
      if (o.kirmizi) k++;
      if (o.mavi) m++;
      if (o.kirmizi || o.mavi) doluSaat[h]++;
    }
  }
  const tamSaatler = [];
  doluSaat.forEach((n, h) => { if (n === 60) tamSaatler.push(h); });
  return {
    tamSaatler,                          // tamamen dolan saatler (iki kişinin işareti birlikte)
    hepsiDolu: tamSaatler.length === 24, // 2. çinko
    tombala: k === 1440 && m === 1440    // ikisi de her dakikayı doldurdu
  };
}

/* ---------- işaretleme ---------- */
async function isaretle() {
  const d = new Date();
  const h = d.getHours(), m = d.getMinutes();
  const etiket = `${pad(h)}:${pad(m)}`;
  const key = keyOf(h, m);
  const btn = $("#isaretle");
  btn.disabled = true;
  try {
    // Önce güncel verinin tamamını al: çinko/tombala geçişini kesin tespit etmek için
    const once = (await istek(`${FIREBASE_URL}.json`)) || {};
    const mevcut = once[key] || {};
    const bugun = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    // Bu dakika bu kişi için kaç kez işaretlenmiş (eski kayıtlarda sayaç yok = 1 kez)
    const oncekiSayi = mevcut[kullanici + "_n"] || (mevcut[kullanici] ? 1 : 0);
    // Aynı gün içinde aynı dakika tekrar işaretlenemez; ama başka bir günde işaretlenebilir
    if (mevcut[kullanici] && mevcut[kullanici + "_son"] === bugun) {
      toast(`Bugün zaten ${etiket} dakikasını işaretlediniz!`); return;
    }
    const yeniSayi = oncekiSayi + 1;
    // PATCH: sadece kendi alanlarını yazar, diğer kişinin işaretini ezmez
    await istek(`${FIREBASE_URL}/${key}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [kullanici]: true, [kullanici + "_n"]: yeniSayi, [kullanici + "_son"]: bugun })
    });
    if (navigator.vibrate) navigator.vibrate(40);
    toast(yeniSayi > 1 ? `✓ ${etiket} işaretlendi (bu dakika için ${yeniSayi}. kez)` : `✓ ${etiket} dakikası işaretlendi!`);

    const sonra = JSON.parse(JSON.stringify(once));
    sonra[key] = { ...mevcut, [kullanici]: true };
    const o = durumHesapla(once), n = durumHesapla(sonra);
    const diger = DIGER[kullanici];
    const ben = ADLAR[kullanici];

    // Kutlama: her ikisine de bildirim. Yoksa normal bildirim sadece karşı tarafa.
    if (!o.tombala && n.tombala) {
      ikisineBildir("🏆 TOMBALA!", "İkiniz de günün 1440 dakikasının hepsini doldurdunuz!", ["trophy"]);
    } else if (!o.hepsiDolu && n.hepsiDolu) {
      ikisineBildir("🎊 2. ÇİNKO!", "Bütün saatler doldu! Şimdi tombala için ikiniz de her dakikayı doldurmalısınız.", ["tada"]);
    } else if (o.tamSaatler.length === 0 && n.tamSaatler.length > 0) {
      ikisineBildir("🎉 1. ÇİNKO!", `Saat ${pad(n.tamSaatler[0])}:00 tamamen doldu! (${ben} tamamladı)`, ["tada"]);
    } else if (mevcut[diger] && !mevcut[kullanici]) {
      bildir(diger, "💜 Aynı dakika!", `${ben} da ${etiket} dakikasını işaretledi`, ["purple_heart"]);
    } else {
      bildir(diger, "💧 Yeni işaret", `${ben} ${etiket} dakikasını işaretledi${yeniSayi > 1 ? " (" + yeniSayi + ". kez)" : ""}`, ["droplet"]);
    }
    await yenile();
  } catch (e) {
    toast("Kaydedilemedi, bağlantıyı kontrol edin");
  } finally { btn.disabled = false; }
}

function ikisineBildir(baslik, mesaj, etiketler) {
  bildir("kirmizi", baslik, mesaj, etiketler);
  bildir("mavi", baslik, mesaj, etiketler);
}

/* ---------- çizim ---------- */
function dakikaDurumu(h, m) {
  const o = veri[keyOf(h, m)] || {};
  return { k: !!o.kirmizi, m: !!o.mavi };
}

function ciz() {
  const simdi = new Date().getHours();
  let toplam = 0;
  for (let h = 0; h < 24; h++) {
    let n = 0;
    for (let m = 0; m < 60; m++) { const s = dakikaDurumu(h, m); if (s.k || s.m) n++; }
    toplam += n;
    const el = $(`#saat-${h}`);
    el.querySelector("span").textContent = `${n}/60 dolu`;
    el.querySelector("i").style.width = (n / 60 * 100) + "%";
    el.classList.toggle("dolu", n === 60);
    el.classList.toggle("simdi", h === simdi);
  }
  let sk = 0, sm = 0, so = 0;
  for (const key in veri) {
    const o = veri[key] || {};
    if (o.kirmizi) sk++;
    if (o.mavi) sm++;
    if (o.kirmizi && o.mavi) so++;
  }
  $("#skK b").textContent = sk;
  $("#skM b").textContent = sm;
  $("#skT").textContent = toplam;
  $("#skO").textContent = so;
  $("#skK").classList.toggle("onde", sk > sm);
  $("#skM").classList.toggle("onde", sm > sk);
  if (acikSaat !== null) cizDetay();
  if (acikKisi !== null) cizIstatistik();
  kutlamaKontrol(durumHesapla(veri));
}

function cizDetay() {
  const d = new Date();
  for (let m = 0; m < 60; m++) {
    const s = dakikaDurumu(acikSaat, m);
    const el = $(`#dk-${m}`);
    el.className = "dk" + (s.k && s.m ? " km" : s.k ? " k" : s.m ? " m" : "")
      + (d.getHours() === acikSaat && d.getMinutes() === m ? " simdi" : "");
    el.querySelector("span").textContent =
      s.k && s.m ? "✓ Boran & Burak (İkiniz)" : s.k ? "● Boran (Kırmızı)" : s.m ? "● Burak (Mavi)" : "Boş";
  }
}

// Ekranda kutlama: seviye 1 = 1. çinko, 2 = 2. çinko, 3 = tombala. Her seviye bu cihazda bir kez gösterilir.
function kutlamaKontrol(d) {
  const seviye = d.tombala ? 3 : d.hepsiDolu ? 2 : d.tamSaatler.length ? 1 : 0;
  if (!seviye) return;
  if (seviye <= Number(depoOku("kutlama_seviye") || 0)) return;
  depoYaz("kutlama_seviye", String(seviye));
  const metin = {
    1: ["🎉 1. ÇİNKO! 🎉", `Saat ${pad(d.tamSaatler[0])}:00 tamamen doldu!`],
    2: ["🎊 2. ÇİNKO! 🎊", "Bütün saatler doldu! Şimdi tombala için ikiniz de her dakikayı doldurmalısınız."],
    3: ["🏆 TOMBALA! 🏆", "İkiniz de günün 1440 dakikasının hepsini doldurdunuz!"]
  }[seviye];
  $("#tombalaBaslik").textContent = metin[0];
  $("#tombalaMetin").textContent = metin[1];
  $("#tombala").classList.add("goster");
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("goster");
  clearTimeout(toast.z); toast.z = setTimeout(() => t.classList.remove("goster"), 2500);
}

/* ---------- kişi istatistiği ---------- */
function cizIstatistik() {
  const kisi = acikKisi;
  if (!kisi) return;
  const renk = kisi === "kirmizi" ? "var(--red)" : "var(--blue)";
  const saat = Array(24).fill(0);          // saat başına toplam işaretleme (tekrarlar dahil)
  const dakikalar = Array.from({ length: 24 }, () => []);   // [dakika, kaç kez]
  let farkliDakika = 0;
  for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m++) {
      const o = veri[keyOf(h, m)];
      if (o && o[kisi]) {
        const sayi = o[kisi + "_n"] || 1;
        saat[h] += sayi;
        dakikalar[h].push([m, sayi]);
        farkliDakika++;
      }
    }
  }
  const topla = (a, b) => saat.slice(a, b).reduce((x, y) => x + y, 0);
  const toplam = topla(0, 24);
  const max = Math.max(...saat);
  const aktif = saat.filter(n => n > 0).length;

  $("#istBaslik").innerHTML = `<span style="color:${renk}">●</span> ${ADLAR[kisi]} • Sağlık Takibi`;

  $("#istKartlar").innerHTML = `
    <div class="ik"><small>Toplam</small><b>${toplam} kez</b>${toplam !== farkliDakika ? `<span>${farkliDakika} farklı dakika</span>` : ""}</div>
    <div class="ik"><small>En yoğun saat</small><b>${toplam ? pad(saat.indexOf(max)) + ":00 (" + max + ")" : "—"}</b></div>
    <div class="ik"><small>Aktif saat</small><b>${aktif}/24</b></div>`;

  const grafik = $("#istGrafik");
  grafik.style.setProperty("--renk", renk);
  grafik.innerHTML = saat.map((n, h) => `
    <div class="col${n ? "" : " bos"}">
      <div class="v">${n || ""}</div>
      <div class="bar" style="height:${n ? Math.max(4, n / max * 100) : 2}px"></div>
      <div class="x">${h % 3 === 0 ? pad(h) : ""}</div>
    </div>`).join("");

  const parcalar = [["Gece", "00–06", 0, 6], ["Sabah", "06–12", 6, 12], ["Öğlen", "12–18", 12, 18], ["Akşam", "18–24", 18, 24]];
  $("#istParca").innerHTML = parcalar.map(([ad, aralik, a, b]) =>
    `<div class="ip"><small>${ad}</small><b>${topla(a, b)}</b><span>${aralik}</span></div>`).join("");

  const satirlar = [];
  for (let h = 0; h < 24; h++) {
    if (!saat[h]) continue;
    satirlar.push(`<div class="il">
      <div class="satir"><span>${pad(h)}:00 – ${pad(h)}:59</span><span>${saat[h]} kez</span></div>
      <div class="chips">${dakikalar[h].map(([m, n]) => `<span class="chip">${pad(h)}:${pad(m)}${n > 1 ? ` <b>×${n}</b>` : ""}</span>`).join("")}</div>
    </div>`);
  }
  $("#istListe").innerHTML = satirlar.join("") || '<div class="bosdurum">Henüz kayıt yok</div>';
}

function istatistikAc(kisi) {
  acikKisi = kisi;
  cizIstatistik();
  goster("istatistik");
  history.pushState({ ist: kisi }, "");
}

/* ---------- ekranlar ---------- */
function goster(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === id));
  window.scrollTo(0, 0);
}

function saatAc(h) {
  acikSaat = h;
  $("#detayBaslik").textContent = `Saat ${pad(h)}:00 Dilimi`;
  for (let m = 0; m < 60; m++) $(`#dk-${m} b`).textContent = `${pad(h)}:${pad(m)}`;
  cizDetay();
  goster("detay");
  history.pushState({ detay: h }, "");
  if (new Date().getHours() === h) {
    const m = new Date().getMinutes();
    setTimeout(() => $(`#dk-${m}`).scrollIntoView({ block: "center" }), 30);
  }
}

function anaGoster() { acikSaat = null; acikKisi = null; goster("ana"); }

function baslat() {
  $("#isaretle").style.background = kullanici === "kirmizi" ? "var(--red)" : "var(--blue)";
  $("#isaretle").innerHTML = `Şu Anki Dakikayı İşaretle<small>${ADLAR[kullanici]}</small>`;
  anaGoster();
  yenile();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden) yenile(); }, 3000);
}

/* ---------- kurulum ---------- */
(function kur() {
  // saat butonları
  const sg = $("#saatler");
  for (let h = 0; h < 24; h++) {
    const b = document.createElement("button");
    b.className = "saat"; b.id = `saat-${h}`;
    b.innerHTML = `<b>Saat ${pad(h)}:00</b><span>0/60 dolu</span><i></i>`;
    b.onclick = () => saatAc(h);
    sg.appendChild(b);
  }
  // dakika satırları
  const dg = $("#dakikalar");
  for (let m = 0; m < 60; m++) {
    const r = document.createElement("div");
    r.className = "dk"; r.id = `dk-${m}`;
    r.innerHTML = `<b>00:00</b><span>Boş</span>`;
    dg.appendChild(r);
  }

  document.querySelectorAll(".rol").forEach(b => b.onclick = () => {
    const rol = b.dataset.rol;
    if (!confirm(`${ADLAR[rol]} olarak kaydedilsin mi?\nBu seçim sadece bir kez yapılır.`)) return;
    kullanici = rol; depoYaz("kullanici", rol);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    baslat();
  });
  $("#isaretle").onclick = isaretle;
  $("#geri").onclick = () => history.back();
  $("#geriIst").onclick = () => history.back();
  document.querySelectorAll(".sk").forEach(b => b.onclick = () => istatistikAc(b.dataset.kisi));
  // Gizli sıfırlama (yanlış seçim için): ana ekran başlığına 7 kez hızlı dokun
  let dokun = 0, dokunZ;
  $("#ana h1").onclick = () => {
    dokun++; clearTimeout(dokunZ); dokunZ = setTimeout(() => dokun = 0, 2000);
    if (dokun >= 7) {
      dokun = 0;
      if (confirm("Kullanıcı kaydı silinsin mi?")) {
        depoSil("kullanici"); clearInterval(pollTimer); kullanici = null; goster("giris");
      }
    }
  };
  $("#tombalaKapat").onclick = () => $("#tombala").classList.remove("goster");
  window.addEventListener("popstate", () => { if (acikSaat !== null || acikKisi !== null) anaGoster(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && kullanici) yenile(); });

  const p = new URLSearchParams(location.search).get("k");
  if (!depoOku("kullanici") && (p === "boran" || p === "burak")) {
    depoYaz("kullanici", p === "boran" ? "kirmizi" : "mavi");
  }
  kullanici = depoOku("kullanici");
  if (kullanici === "kirmizi" || kullanici === "mavi") baslat(); else goster("giris");

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
